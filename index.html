<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>阿輝英文日課</title>
  <meta name="description" content="每日打卡、閱讀、單字本、複習與進度的個人英文學習 App">
  <meta name="theme-color" content="#f4f7f5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 id="title">阿輝英文日課</h1>
    <span class="top-r"><span id="syncDot" class="sync-dot" title="同步狀態"></span><a href="#settings" id="gear" class="gear" aria-label="設定">⚙️</a></span>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="主選單">
    <a href="#today" data-tab="today"><span>☀️</span>今天</a>
    <a href="#read" data-tab="read"><span>📖</span>閱讀</a>
    <a href="#review" data-tab="review"><span>🔁</span>複習</a>
    <a href="#words" data-tab="words"><span>📒</span>單字本</a>
    <a href="#stats" data-tab="stats"><span>📈</span>進度</a>
  </nav>
  <div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast" hidden></div>
  <script src="wordlist.js"></script>
  <script src="help.js"></script>
  <script src="app.js"></script>
</body>
</html>
